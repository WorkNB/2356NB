name: Linux SSH over Tailscale

on:
  workflow_dispatch: # 允许手动触发

jobs:
  secure-ssh:
    runs-on: ubuntu-latest # 使用 Ubuntu Linux 运行器
    timeout-minutes: 3600 # 设置超时，避免长时间占用

    steps:
      - name: Checkout repository (optional)
        uses: actions/checkout@v4 # 如果后续步骤需要代码，可以签出仓库

      - name: Install Tailscale and SSH server
        run: |
          set -x # 打开调试模式，方便查看日志

          # 安装 Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # 更新系统并安装 OpenSSH 服务器
          sudo apt-get update
          sudo apt-get install -y openssh-server

          # 配置 SSH 服务器
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin no/' /etc/ssh/sshd_config
          echo "PasswordAuthentication no" | sudo tee -a /etc/ssh/sshd_config
          echo "PermitRootLogin no" | sudo tee -a /etc/ssh/sshd_config

          # 启动 SSH 服务
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Generate and authorize SSH key
        run: |
          # 生成专用于此次连接的 SSH 密钥对
          ssh-keygen -t ed25519 -f /tmp/github_action_ssh -N ""

          # 将公钥添加到授权密钥列表，允许连接
          mkdir -p ~/.ssh
          cat /tmp/github_action_ssh.pub >> ~/.ssh/authorized_keys

          # 显示公钥（用于调试，可选）
          echo "生成的公钥是："
          cat /tmp/github_action_ssh.pub

          # 将私钥保存为工作流输出，后续连接使用
          echo "PRIVATE_KEY<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/github_action_ssh >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: ssh_key

      - name: Establish Tailscale connection
        run: |
          # 使用认证密钥加入 Tailscale 网络，并设置唯一的主机名
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-linux-runner-$GITHUB_RUN_ID

          # 获取 Tailscale 分配的 IP 地址
          TAILSCALE_IP=$(sudo tailscale ip -4)
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV

          # 等待网络就绪
          sleep 5

      - name: Verify SSH accessibility
        run: |
          echo "尝试通过 Tailscale IP 连接 SSH..."
          echo "Tailscale IP 是: $TAILSCALE_IP"

          # 简单测试 SSH 端口是否开放
          if nc -z $TAILSCALE_IP 22; then
            echo "SSH 端口连接测试成功。"
          else
            echo "警告：SSH 端口连接测试未成功。"
          fi

      - name: Maintain connection and output info
        run: |
          echo " "
          echo "=========================================="
          echo "        Linux SSH 环境已就绪"
          echo "=========================================="
          echo "连接地址 (Tailscale IP): $TAILSCALE_IP"
          echo "SSH 端口: 22"
          echo "用户名: $USER"
          echo " "
          echo "使用以下命令进行连接："
          echo "ssh -i /path/to/saved/private_key $USER@$TAILSCALE_IP"
          echo " "
          echo "私钥内容已输出到日志中（见前一步骤）。请妥善保存。"
          echo "此工作流运行器将保持活动状态，直到您手动取消或超时。"
          echo "=========================================="
          echo " "

          # 保持运行器活跃
          while true; do
            echo "[$(date)] SSH 环境活跃中... (工作流运行 ID: $GITHUB_RUN_ID)"
            sleep 300
          done
