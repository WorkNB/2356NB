name: Linux SSH

on:
  workflow_dispatch: # 允许手动触发

jobs:
  secure-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tailscale and SSH server
        run: |
          set -x
          # 安装 Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # 安装 OpenSSH 服务器
          sudo apt-get update
          sudo apt-get install -y openssh-server
          
          # 配置 SSH 服务器 - 启用root密码登录
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin no/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          
          # 启动 SSH 服务
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Generate root password and SSH key
        run: |
          set -x
          # 生成随机root密码（12位）
          ROOT_PASSWORD=$(openssl rand -base64 12 | tr -d '/+' | cut -c1-12)
          echo "生成的root密码: $ROOT_PASSWORD"
          
          # 设置root用户密码
          echo "root:$ROOT_PASSWORD" | sudo chpasswd
          
          # 生成SSH密钥对
          sudo ssh-keygen -t ed25519 -f /root/.ssh/github_action_ssh -N ""
          
          # 授权root公钥
          sudo mkdir -p /root/.ssh
          sudo cat /root/.ssh/github_action_ssh.pub | sudo tee -a /root/.ssh/authorized_keys
          sudo chmod 600 /root/.ssh/authorized_keys
          
          # 保存密码和私钥到GITHUB_OUTPUT
          echo "ROOT_PASSWORD=$ROOT_PASSWORD" >> $GITHUB_OUTPUT
          echo "ROOT_PRIVATE_KEY<<EOF" >> $GITHUB_OUTPUT
          sudo cat /root/.ssh/github_action_ssh >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        id: auth_info

      - name: Establish Tailscale connection
        run: |
          # 使用认证密钥加入 Tailscale 网络
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-root-runner-$GITHUB_RUN_ID
          
          # 获取 Tailscale IP
          TAILSCALE_IP=$(sudo tailscale ip -4)
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
          
          # 等待网络就绪
          sleep 10

      - name: Verify root SSH accessibility
        run: |
          echo "=== Root用户连接测试 ==="
          echo "Tailscale IP: $TAILSCALE_IP"
          
          # 测试root用户SSH连接
          if sshpass -p '${{ steps.auth_info.outputs.ROOT_PASSWORD }}' ssh -o StrictHostKeyChecking=no root@$TAILSCALE_IP "whoami"; then
            echo "✅ Root用户SSH连接测试成功"
          else
            echo "❌ Root用户SSH连接测试失败"
            exit 1
          fi

      - name: Display root connection information
        run: |
          echo ""
          echo "=========================================="
          echo "        Root用户SSH环境已就绪"
          echo "=========================================="
          echo "📡 连接地址: $TAILSCALE_IP"
          echo "🔑 SSH端口: 22"
          echo "👤 用户名: root"
          echo "🔐 Root密码: ${{ steps.auth_info.outputs.ROOT_PASSWORD }}"
          echo ""
          echo "=== 连接方式 ==="
          echo "1. 使用密码认证:"
          echo "   ssh root@$TAILSCALE_IP"
          echo "   密码: ${{ steps.auth_info.outputs.ROOT_PASSWORD }}"
          echo ""
          echo "2. 使用密钥认证:"
          echo "   ssh -i /path/to/private_key root@$TAILSCALE_IP"
          echo ""
          echo "=== 权限说明 ==="
          echo "• 当前已获得完整的root权限"
          echo "• 可以执行所有系统管理操作"
          echo "• 请谨慎操作，避免系统损坏"
          echo ""
          echo "=== 重要安全提示 ==="
          echo "• 此环境仅在Tailscale私有网络中可用"
          echo "• 工作流结束后所有凭据将失效"
          echo "• 建议操作完成后及时关闭工作流"
          echo "=========================================="
          echo ""

      - name: Keep alive and maintain root session
        run: |
          # 保持运行器活跃
          counter=0
          while true; do
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] Root SSH环境活跃中... (运行时长: ${counter}分钟)"
            echo "当前用户: $(whoami)"
            echo "Root权限测试: $(sudo whoami)"
            counter=$((counter + 5))
            sleep 300
          done
