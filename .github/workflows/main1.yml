name: SSH on Debian

on:
  workflow_dispatch:

jobs:
  secure-ssh:
    runs-on: debian-latest
    timeout-minutes: 3600

    steps:
      - name: Install OpenSSH Server
        run: |
          sudo apt-get update
          # 安装 OpenSSH 服务器
          sudo apt-get install -y openssh-server [1,3](@ref)
          # 启动 SSH 服务并设置开机自启 [3](@ref)
          sudo systemctl start ssh
          sudo systemctl enable ssh
          # 验证服务状态 [3](@ref)
          sudo systemctl status ssh

      - name: Configure SSH for Enhanced Security
        run: |
          # 备份原始配置文件
          sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.backup
          # 使用密码认证（方便临时访问，可根据需要关闭）
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          # 确保允许密码认证
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          # 可选：更改默认端口以减少随机攻击 [1,5](@ref)
          # sudo sed -i 's/#Port 22/Port 2222/' /etc/ssh/sshd_config
          # 重启 SSH 服务以使配置生效 [3](@ref)
          sudo systemctl restart ssh

      - name: Configure Firewall (UFW)
        run: |
          # 开放 SSH 端口（如果修改了端口，这里也需要相应调整）
          sudo ufw allow ssh [3,4](@ref)
          # 如果你修改了 SSH 端口，例如 2222，则应使用：
          # sudo ufw allow 2222/tcp [1](@ref)
          sudo ufw --force enable  # 启用防火墙
          sudo ufw reload

      - name: Create SSH User and Secure Password
        run: |
          # 生成随机密码
          PASSWORD=$(openssl rand -base64 16)
          # 创建用户（此处用户名为 cli-user，可自定义）
          sudo useradd -m -s /bin/bash cli-user
          echo "cli-user:$PASSWORD" | sudo chpasswd
          # 将用户加入 sudo 组（可选，如果你需要该用户有管理员权限）
          sudo usermod -aG sudo cli-user
          # 将凭证保存到 GitHub Actions 环境变量
          echo "SSH_CREDS=User: cli-user | Password: $PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          # 遵循 Tailscale 官方指南安装 [5](@ref)
          curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update
          sudo apt-get install -y tailscale

      - name: Establish Tailscale Connection
        run: |
          # 启动 Tailscale
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-cli-$GITHUB_RUN_ID
          # 获取 Tailscale IP
          TS_IP=""
          for i in {1..10}; do
            TS_IP=$(sudo tailscale ip -4)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$TS_IP" ]; then
            echo "Failed to get Tailscale IP"
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Maintain Connection and Output Info
        run: |
          echo " "
          echo "=== SSH on Debian Access Information ==="
          echo "Tailscale IP Address: $TAILSCALE_IP"
          echo "Username: cli-user"
          echo "Password: $(echo $SSH_CREDS | sed 's/Password: //')" # 安全起见，只显示密码部分
          echo " "
          echo "SSH Command:"
          echo "ssh cli-user@$TAILSCALE_IP"
          # 如果你修改了 SSH 端口，命令应为：
          # echo "ssh -p 2222 cli-user@$TAILSCALE_IP"
          echo "========================================"
          echo " "
          echo "Keep this workflow running to maintain the SSH connection."
          echo "The runner will automatically terminate after 60 minutes (or the set timeout), or when you cancel the run."
          # 保持工作流运行
          while true; do
            echo "[$(date)] SSH session active. Press 'Cancel' in GitHub Actions to terminate."
            sleep 300
          done
